apiVersion: v1
kind: Secret
metadata:
  name: platform-secret
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg2://mlplatform:replace-me@postgres:5432/mlplatform
  POSTGRES_USER: mlplatform
  POSTGRES_PASSWORD: replace-me
  POSTGRES_DB: mlplatform
  MINIO_ROOT_USER: replace-me
  MINIO_ROOT_PASSWORD: replace-me
  AWS_ACCESS_KEY_ID: replace-me
  AWS_SECRET_ACCESS_KEY: replace-me
# Replace every placeholder before deploying outside a local test cluster.
