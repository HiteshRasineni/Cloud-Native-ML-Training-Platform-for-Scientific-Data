apiVersion: v1
kind: Namespace
metadata:
  name: cloud-ml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
data:
  EXECUTOR_BACKEND: kubernetes
  DATABASE_URL: postgresql+psycopg2://mlplatform:mlplatform@postgres:5432/mlplatform
  REDIS_URL: redis://redis:6379/0
  BACKEND_URL: http://backend:8000
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: mlplatform
  PUSHGATEWAY_URL: http://pushgateway:9091
  K8S_NAMESPACE: cloud-ml
  WORKER_IMAGE: platform/training-worker:latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
data:
  BACKEND_URL: http://backend:8000
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: mlplatform
  PUSHGATEWAY_URL: http://pushgateway:9091
