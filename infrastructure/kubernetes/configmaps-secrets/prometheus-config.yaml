apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: backend
        static_configs: [{targets: [backend:8000]}]
      - job_name: scheduler
        static_configs: [{targets: [scheduler:8001]}]
      - job_name: pushgateway
        honor_labels: true
        static_configs: [{targets: [pushgateway:9091]}]
      - job_name: cadvisor
        static_configs: [{targets: [cadvisor:8080]}]
