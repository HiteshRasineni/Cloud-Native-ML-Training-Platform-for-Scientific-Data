apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scheduler-job-manager
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: ['']
    resources: [pods, configmaps]
    verbs: [get, list, watch, create, delete, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scheduler-job-manager
subjects:
  - kind: ServiceAccount
    name: scheduler
roleRef:
  kind: Role
  name: scheduler-job-manager
  apiGroup: rbac.authorization.k8s.io
