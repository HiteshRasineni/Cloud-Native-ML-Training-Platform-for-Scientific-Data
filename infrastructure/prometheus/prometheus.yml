global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:8001"]
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
